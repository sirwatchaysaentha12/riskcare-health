name: PM2.5 pipeline quality

on:
  push:
    paths:
      - 'notebooks/**'
      - 'admin-app/src/**'
      - 'admin-app/supabase/migrations/**'
      - 'admin-app/tests/**'
      - 'frontend/src/pages/ProvinceForecast.jsx'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile notebooks/run_pm25_province_pipeline.py notebooks/pm25_accuracy_guard.py notebooks/publish_selected_province_forecasts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: admin-app
      - run: npm run test:trend
        working-directory: admin-app
      - run: node --test tests/provinceForecast.test.mjs
        working-directory: admin-app
      - run: npm run build
        working-directory: admin-app
